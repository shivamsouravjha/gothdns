name: End-to-end testing with running resolver
inputs:
  # name of the docker service for the resolver under testing
  resolver:
    required: true
    type: string

  # port for resolver under testing
  port:
    required: true
    type: int

  # plugins gothdns
  staticip:
    required: true
    type: bool
  ednsformerr:
    required: true
    type: bool
  nodobitsupport:
    required: true
    type: bool
  noednssupport:
    required: true
    type: bool
  mismatchid:
    required: true
    type: bool
runs:
  using: "composite"
  steps:
    - name: Create network
      shell: bash
      run: |
        docker network create --driver=bridge --subnet=192.168.0.0/16 gothdns

    - name: Connect target
      shell: bash
      run: |
        docker network connect --ip "192.168.0.10" gothdns ${{ inputs.resolver }}

    - name: Run gothdns
      shell: bash
      run: |
        docker run -d --name gothdns --network gothdns --ip "192.168.0.11" learndnssecurity/gothdns:main
        sleep 5

    - name: plugin staticip
      shell: bash
      if: ${{ inputs.staticip }}
      run: |
        output=$(dig @127.0.0.1 -p ${{ inputs.port }} staticip.goth.dns A +edns)
        
        echo "output: $output"
        echo $output | grep "NOERROR"
        echo $output | grep "127.0.0.1"

    - name: plugin ednsformerr
      shell: bash
      if: ${{ inputs.ednsformerr }}
      run: |
        output=$(dig @127.0.0.1 -p ${{ inputs.port }} ednsformerr.goth.dns A +edns)
        
        echo "output: $output"
        echo $output | grep "NOERROR"
        echo $output | grep "127.0.0.1"

    - name: plugin nodobitsupport
      shell: bash
      if: ${{ inputs.nodobitsupport }}
      run: |
        output=$(dig @127.0.0.1 -p ${{ inputs.port }} no-dobit-support.goth.dns A +edns)
        
        echo "output: $output"
        echo $output | grep "NOERROR"
        echo $output | grep "127.0.0.1"

    - name: plugin noednssupport
      shell: bash
      if: ${{ inputs.noednssupport }}
      run: |
        output=$(dig @127.0.0.1 -p ${{ inputs.port }} noednssupport.goth.dns A +edns)
        
        echo "output: $output"
        echo $output | grep "NOERROR"
        echo $output | grep "127.0.0.1"

    - name: plugin mismatchid
      shell: bash
      if: ${{ inputs.noednssupport }}
      run: |
        output=$(dig @127.0.0.1 -p ${{ inputs.port }} mismatchid.goth.dns A +edns)
        
        echo "output: $output"
        echo $output | grep "SERVFAIL"